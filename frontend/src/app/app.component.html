<div class="container">
  <header>
    <div class="header-content">
      <h1>✈️ Trip Planner AI</h1>
      <app-query-box 
        (onSubmit)="onQuerySubmit($event)"
        (onLocationClick)="onGetCurrentLocation()"
        [isLoading]="isLoading"
        [currentLocation]="currentLocation">
      </app-query-box>
    </div>
  </header>

  <div class="messages" *ngIf="error || success">
    <div class="message error" *ngIf="error">
      <span>❌ {{ error }}</span>
    </div>
    <div class="message success" *ngIf="success">
      <span>✅ {{ success }}</span>
    </div>
  </div>

  <div class="main-content">
    <app-map 
      #mapComponent
      [tripData]="tripData"
      [headerHeight]="headerHeight"
      [isLoading]="isLoading">
    </app-map>

    <app-trip-details 
      [tripData]="tripData"
      [headerHeight]="headerHeight"
      (onLocationClick)="onTripDetailsLocationClick($event)">
    </app-trip-details>
  </div>
</div>
