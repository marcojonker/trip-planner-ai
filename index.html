<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Planner AI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v9.1.0/ol.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="query-section">
                <h1>🗺️ Trip Planner AI</h1>
                <div class="input-group">
                    <input 
                        type="text" 
                        id="queryInput" 
                        class="query-input" 
                        placeholder="E.g., I want to buy shoes and bread nearby 51.6010502,5.6087735"
                        autocomplete="off"
                    />
                    <button id="locationBtn" class="location-btn" title="Use current location">⊙</button>
                    <button id="submitBtn" class="submit-btn">Plan Trip</button>
                </div>
                <div id="loading" class="loading hidden">
                    <span class="spinner"></span>
                    <span>Planning your trip...</span>
                </div>
                <div id="errorMessage" class="error-message hidden"></div>
                <div id="successMessage" class="success-message hidden"></div>
            </div>
        </div>

        <div id="map" class="map"></div>

        <div class="sidebar">
            <div class="sidebar-content">
                <h2>Trip Details</h2>
                <div id="tripDetails" class="trip-details">
                    <p class="placeholder-text">Plan a trip to see details here</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/ol@v9.1.0/dist/ol.js"></script>
    <script src="frontend.js"></script>
</body>
</html>
